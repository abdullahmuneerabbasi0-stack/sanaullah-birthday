<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ED1C24" />
    <meta name="robots" content="noindex" />
    <title>Your surprise gift 🎁</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 24px; padding: 24px; box-sizing: border-box; background: #ED1C24; font-family: system-ui, sans-serif;
      }
      img {
        width: 100%; max-width: 480px; max-height: 80svh; object-fit: contain; border-radius: 16px;
        animation: pop .7s cubic-bezier(.2,1.6,.4,1) both;
      }
      a {
        color: #FFFBF3; text-decoration: none; font-weight: 600; padding: 14px 24px; min-height: 48px; box-sizing: border-box;
        border: 2px solid rgba(255,251,243,.7); border-radius: 999px;
      }
      .sound {
        display: inline-flex; align-items: center; gap: 8px; background: rgba(36,9,30,.35); color: #FFFBF3;
        border: 0; font: 600 15px system-ui, sans-serif; padding: 12px 20px; min-height: 48px; border-radius: 999px;
        cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform .2s;
      }
      .sound:active { transform: scale(.95); }
      .sound.nudge { animation: nudge 1.2s ease-in-out infinite; }
      @keyframes nudge { 0%,100% { transform: scale(1) } 50% { transform: scale(1.08) } }
      @keyframes pop { from { transform: scale(.3) rotate(-12deg); opacity: 0 } to { transform: none; opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { img { animation: none } }
    </style>
  </head>
  <body>
    <img src="photos/surprise.png" alt="Your surprise gift" />
    <button class="sound" id="sound" type="button" hidden>🔊 Play again</button>
    <a href="./?preview=1">← Back to your birthday page</a>
    <audio id="sfx" src="music/surprise.mp3" preload="auto"></audio>
    <script>
      // Try to play straight away. Phones that block sound until a tap on this page
      // get a "Tap for sound" button, and any tap anywhere starts it.
      const sfx = document.getElementById('sfx')
      const btn = document.getElementById('sound')
      const play = () => { sfx.currentTime = 0; return sfx.play() }
      const blocked = () => {
        btn.hidden = false
        btn.textContent = '🔊 Tap for sound'
        btn.classList.add('nudge')
        const unlock = () => {
          document.removeEventListener('pointerdown', unlock, true)
          btn.textContent = '🔊 Play again'
          btn.classList.remove('nudge')
          play().catch(() => {})
        }
        document.addEventListener('pointerdown', unlock, true)
      }
      btn.addEventListener('click', () => { play().catch(() => {}) })
      sfx.addEventListener('play', () => { btn.hidden = false; btn.textContent = '🔊 Play again'; btn.classList.remove('nudge') })
      // tiny delay so it lands with the pop-in animation
      setTimeout(() => { play().catch(blocked) }, 250)
    </script>
  </body>
</html>
